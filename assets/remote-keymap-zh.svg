<text x="305" y="970" class="body">页面向上 / 向下滚动</text>
<text x="815" y="970" class="body">不另设动作</text>
<text x="1180" y="970" class="body">不另设动作</text>
<text x="75" y="1055" class="small">* Codex 需在前台，输入框有焦点；长按确定在任务回复中用于引导，空闲时正常发送。</text>
<text x="75" y="1095" class="small">语音：Typeless 实际快捷键 Fn；SayAll 开启 Fn 点按兼容；两端麦克风都选 MiRemoteV 2ch。</text>
<text x="75" y="1135" class="small">连续方向与删除不切换动作。语音文字出现后再发送。Typeless 单次听写最长 9 分钟。</text>
</svg>